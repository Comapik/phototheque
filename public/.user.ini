; Sur un hébergement mutualisé (O2Switch, PHP-FPM), ce fichier permet de
; relever les limites d'upload sans accès au php.ini du serveur. Sans
; effet si le PHP du serveur n'est pas en PHP-FPM/CGI (auquel cas, régler
; ces valeurs depuis le panneau d'hébergement).
upload_max_filesize = 25M
post_max_size = 100M
memory_limit = 256M
